services:
  excalidraw-live:
    image: ghcr.io/nullifyr/excalidraw-live-unraid:1.0.0
    container_name: excalidraw-live
    user: "99:100"
    ports:
      - "127.0.0.1:3031:3000"
    volumes:
      - ./appdata:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
